<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oxford Board Games Society board game library">
  <title>Oxford Board Games Society | Board Game Library</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        Oxford Board Games Society
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Welcome</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="committee.html">Committee</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="termcard.html">Termcard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="mailing-list.html">Mailing List</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="library.html">
              Board Game Library
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="documents.html">Society Documents</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="page-heading mb-4">
      <p class="eyebrow mb-2">The collection</p>
      <h1 class="display-5 fw-bold">Board Game Library</h1>
      <p class="lead text-secondary">
        Browse the games in the Oxford Board Games Society collection.
      </p>
    </div>

    <div class="row g-3 mb-4" aria-label="Library filters">
      <div class="col-md-4">
        <label class="form-label" for="game-search">Search games</label>
        <input class="form-control" type="search" id="game-search" placeholder="Search by name or description">
      </div>

      <div class="col-md-4">
        <label class="form-label" for="player-filter">Players</label>
        <select class="form-select" id="player-filter">
          <option value="0">Any number of players</option>
          <option value="1">1 player</option>
          <option value="2">2 players</option>
          <option value="3">3 players</option>
          <option value="4">4 players</option>
          <option value="5">5 players</option>
          <option value="6">6 players</option>
          <option value="7">7 players</option>
          <option value="8">8+ players</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="complexity-filter">Difficulty</label>
        <select class="form-select" id="complexity-filter">
          <option value="">Any difficulty</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <div class="row g-4" id="library-list" aria-live="polite">
      <div class="col-12">
        <div class="alert alert-secondary">Loading games...</div>
      </div>
    </div>
  </main>

  <footer class="border-top py-4">
    <div class="container small text-secondary">
      &copy; <span data-current-year></span> Oxford Board Games Society
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="assets/site.js"></script>
</body>

</html>
